---
name: Manage - Sync fork (Branch master)

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  update_external_airflow_fork:
    name: Sync branch master with origin
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.GH_APP_SRP_ID }}
          private-key: ${{ secrets.GH_APP_SRP_PRIVATE_KEY }}

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Synchronize the given branch now
        uses: TobKed/github-forks-sync-action@52429f0e1732f747a6d0654dd27867339237268f  # v0.5.1
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          upstream_repository: Cyclenerd/hcloud-github-runner
          target_repository: ${{ github.repository }}
          upstream_branch: master
          target_branch: master
          force: false
          tags: false
