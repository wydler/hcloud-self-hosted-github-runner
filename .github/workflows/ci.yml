---
name: "CI Testing Bash Script"

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - "customize"
    paths:
      - 'action.sh'
      - '.github/workflows/ci.yml'


permissions:
  contents: read


jobs:
  test:
    name: CI/CD Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Start Shellcheck
        run: shellcheck *.sh
