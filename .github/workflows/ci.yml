---
name: "CI Testing Bash Script"

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - "customize"
    paths:
      - 'action.sh'
      - '.github/workflows/ci.yml'


permissions:
  contents: read


jobs:
  test:
    name: CI/CD Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start Shellcheck
        run: shellcheck *.sh
