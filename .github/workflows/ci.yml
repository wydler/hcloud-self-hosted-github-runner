---
name: "CI Testing Bash Script"

"on":
  workflow_dispatch:
  pull_request:
    branches:
      - "customize"
    paths:
      - 'action.sh'
      - '.github/workflows/ci.yml'


permissions:
  contents: read


jobs:
  test:
    name: CI/CD Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Start Shellcheck
        run: shellcheck *.sh
